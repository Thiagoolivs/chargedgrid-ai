<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeGrid AI — Volt</title>
<style>
  :root{
    --bg:#121212;
    --bg-side:#0a0a0a;
    --bg-soft:#1c1c1c;
    --bg-hover:#242424;
    --line:#2a2a2a;
    --fg:#ececec;
    --fg-dim:#a0a0a0;
    --fg-mute:#6b6b6b;
    --red:#ff2137;
    --red-deep:#d40f21;
    --red-ghost:rgba(255,33,55,.14);
    --ok:#22c55e;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .mono{font-family:var(--mono)}

  .app{display:grid;grid-template-columns:268px 1fr;height:100dvh}
  .app.collapsed{grid-template-columns:0 1fr}
  .app.collapsed .sidebar{opacity:0;pointer-events:none}

  /* ============ sidebar ============ */
  .sidebar{
    background:var(--bg-side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    transition:opacity .16s ease;
  }
  .side-head{padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 6px}
  .brand-name{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
  .brand-name b{color:var(--red)}

  .new-chat{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:10px 12px;border-radius:11px;
    background:var(--bg-soft);border:1px solid var(--line);
    font-size:14px;font-weight:500;text-align:left;
  }
  .new-chat:hover{background:var(--bg-hover);border-color:#3a3a3a}
  .new-chat svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:2}

  .search{position:relative}
  .search svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;stroke:var(--fg-mute);fill:none;stroke-width:1.8;
  }
  .search input{
    width:100%;padding:9px 11px 9px 32px;border-radius:10px;
    background:transparent;border:1px solid transparent;color:var(--fg);
    font-family:inherit;font-size:13.5px;outline:none;
  }
  .search input:hover{background:var(--bg-soft)}
  .search input:focus{background:var(--bg-soft);border-color:var(--line)}
  .search input::placeholder{color:var(--fg-mute)}

  .history{flex:1;overflow-y:auto;padding:6px 8px 12px;min-height:0}
  .history::-webkit-scrollbar{width:7px}
  .history::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:4px}
  .hist-group{
    font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-mute);
    padding:14px 10px 6px;
  }
  .hist-item{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--fg-dim);
    white-space:nowrap;overflow:hidden;
  }
  .hist-item:hover{background:var(--bg-soft);color:var(--fg)}
  .hist-item.is-active{background:var(--bg-hover);color:var(--fg)}
  .hist-item.is-active .bar{background:var(--red)}
  .hist-item .bar{width:2px;height:15px;border-radius:2px;background:transparent;flex:none}
  .hist-item .txt{flex:1;overflow:hidden;text-overflow:ellipsis}
  .hist-item .del{
    opacity:0;flex:none;background:none;border:0;padding:2px;line-height:0;border-radius:5px;
  }
  .hist-item:hover .del{opacity:.55}
  .hist-item .del:hover{opacity:1;background:var(--red-ghost)}
  .hist-item .del svg{width:13px;height:13px;stroke:var(--red);fill:none;stroke-width:1.8}
  .hist-empty{padding:18px 10px;font-size:13px;color:var(--fg-mute)}

  .side-foot{
    border-top:1px solid var(--line);padding:11px 14px;
    font-size:10.5px;line-height:1.55;color:#5c5c5c;
  }

  /* ============ main ============ */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:11px 16px;border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:32px;height:32px;border-radius:9px;background:none;border:0;
    display:grid;place-items:center;flex:none;
  }
  .icon-btn:hover{background:var(--bg-soft)}
  .icon-btn svg{width:17px;height:17px;stroke:var(--fg-dim);fill:none;stroke-width:1.8}
  .topbar h1{margin:0;font-size:15px;font-weight:600}
  .memchip{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    padding:6px 11px;border-radius:999px;
    background:var(--bg-soft);border:1px solid var(--line);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--fg-dim);
  }
  .memchip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

  .scroll{flex:1;overflow-y:auto;min-height:0}
  .scroll::-webkit-scrollbar{width:9px}
  .scroll::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:5px}
  .col{max-width:768px;margin:0 auto;padding:26px 20px 12px}

  /* ============ volt ============ */
  .volt{display:block;overflow:visible}
  .volt .led{fill:var(--red)}
  .volt .shell{fill:#1f1f1f;stroke:#333;stroke-width:1.4}
  .volt .visor{fill:#070707}
  .volt .eye{fill:var(--red);transform-box:fill-box;transform-origin:center;transition:transform .08s linear}
  .volt .mouth{stroke:var(--red);stroke-width:2;stroke-linecap:round;fill:none;transition:d .2s ease}
  .volt.blinking .eye{transform:scaleY(.12)}
  .volt.thinking .led{animation:pulse .9s ease-in-out infinite}
  .volt.alert .eye{fill:#ff6b6b}
  .volt.alert{animation:shake .4s ease}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 0 8px}
  .hero .volt{width:104px;height:104px;margin-bottom:18px;cursor:pointer}
  .hero h2{margin:0 0 6px;font-size:25px;font-weight:650;letter-spacing:-.02em}
  .hero h2 b{color:var(--red);font-weight:650}
  .hero p{margin:0;color:var(--fg-dim);font-size:14.5px;max-width:460px}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:26px;width:100%}
  .chip{
    padding:13px 15px;border-radius:12px;font-size:13.5px;line-height:1.45;
    background:var(--bg-soft);border:1px solid var(--line);color:var(--fg-dim);
    text-align:left;transition:.12s;
  }
  .chip:hover{border-color:var(--red);color:var(--fg);background:var(--bg-hover)}
  .chip span{display:block;font-size:11px;color:var(--fg-mute);margin-bottom:3px}

  /* ============ mensagens ============ */
  .msg{margin-bottom:26px}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .body{
    background:var(--bg-soft);border:1px solid var(--line);
    padding:11px 16px;border-radius:18px;border-bottom-right-radius:6px;
    max-width:78%;white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .msg.bot{display:flex;gap:13px}
  .msg.bot .avatar{width:30px;height:30px;flex:none;margin-top:2px}
  .msg.bot .body{flex:1;min-width:0}
  .msg-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .who{font-size:13px;font-weight:650}
  .badge{
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--fg-mute);
  }
  .badge.tecnica{color:#7fb8ff;border-color:#1d3654;background:#0d1826}
  .badge.conversa{color:var(--ok);border-color:#14532d;background:#08160e}
  .badge.fora_escopo{color:#f5a524;border-color:#4a3410;background:#181206}
  .badge.bloqueado,.badge.injection,.badge.leak{color:var(--red);border-color:#4a1218;background:#170709}
  .text{white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.bot.err .text{color:#ffb3ba}
  .sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .source{
    font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:5px;
    background:var(--bg-soft);border:1px solid var(--line);color:var(--fg-mute);
  }
  .dots{display:flex;gap:5px;padding:7px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--fg-mute);animation:bl 1.3s infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,60%,100%{opacity:.22}30%{opacity:1}}

  /* ============ composer ============ */
  .composer{padding:8px 20px 18px}
  .composer-col{max-width:768px;margin:0 auto}
  .box{
    display:flex;align-items:flex-end;gap:9px;
    background:var(--bg-soft);border:1px solid var(--line);
    border-radius:24px;padding:9px 9px 9px 18px;transition:border-color .15s;
  }
  .box:focus-within{border-color:#3d3d3d}
  textarea{
    flex:1;background:none;border:0;outline:none;resize:none;color:var(--fg);
    font-family:inherit;font-size:15px;line-height:1.5;max-height:190px;padding:7px 0;
  }
  textarea::placeholder{color:#5e5e5e}
  .send{
    width:34px;height:34px;border-radius:50%;flex:none;border:0;
    background:var(--red);display:grid;place-items:center;transition:.14s;
  }
  .send:hover:not(:disabled){background:var(--red-deep)}
  .send:disabled{background:#303030;cursor:not-allowed}
  .send svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2}
  .foot{text-align:center;font-size:11px;color:#5c5c5c;margin-top:9px}

  @media (max-width:840px){
    .app{grid-template-columns:0 1fr}
    .sidebar{position:fixed;inset:0 auto 0 0;width:268px;z-index:20;opacity:0;pointer-events:none}
    .app.open .sidebar{opacity:1;pointer-events:auto}
    .chips{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">
        <svg class="volt" id="volt-mini" style="width:22px;height:22px" viewBox="0 0 64 64"></svg>
        <span class="brand-name">ChargeGrid <b>AI</b></span>
      </div>
      <button class="new-chat" id="new-chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Nova conversa
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="text" placeholder="Buscar conversas" autocomplete="off">
      </div>
    </div>
    <div class="history" id="history"></div>
    <div class="side-foot">
      Conversas no SQLite · memória do agente no LangGraph.<br>
      O servidor mantém as 7 conversas mais recentes.
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle" aria-label="Alternar painel">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1>Volt · assistente GoodWe HCA-G2</h1>
      <div class="memchip"><span class="dot"></span><span id="memtxt">memória 0 turnos</span></div>
    </header>

    <div class="scroll" id="scroll">
      <div class="col" id="col"></div>
    </div>

    <div class="composer">
      <div class="composer-col">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Pergunte ao Volt…"></textarea>
          <button class="send" id="send" aria-label="Enviar">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="foot" id="foot">O Volt responde com base na documentação GoodWe. Confirme dados críticos.</div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const API = new URLSearchParams(location.search).get("api") || "";
  const base = (p) => API.replace(/\/$/, "") + p;

  const $ = (id) => document.getElementById(id);
  const app = $("app"), col = $("col"), scroll = $("scroll");
  const input = $("input"), send = $("send"), foot = $("foot");
  const historyEl = $("history"), search = $("search"), memtxt = $("memtxt");

  // O historico vive no SQLite da Sprint 2 (/conversations) e o conversation_id
  // e o mesmo thread_id do checkpointer do LangGraph. Nada de localStorage:
  // a conversa sobrevive a recarga da pagina e a outro navegador.
  let conversas = [], activeId = null, mensagens = [], busy = false, heroVolt = null;

  /* -------------------- Volt -------------------- */
  const VOLT_SVG = `
    <g class="antenna"><path d="M32 12V6" stroke="#333" stroke-width="2"/><circle class="led" cx="32" cy="4" r="3.2"/></g>
    <rect class="shell" x="11" y="12" width="42" height="38" rx="13"/>
    <rect class="shell" x="5"  y="25" width="5"  height="12" rx="2.5"/>
    <rect class="shell" x="54" y="25" width="5"  height="12" rx="2.5"/>
    <rect class="visor" x="16" y="20" width="32" height="19" rx="9.5"/>
    <circle class="eye eye-l" cx="25" cy="29.5" r="3.4"/>
    <circle class="eye eye-r" cx="39" cy="29.5" r="3.4"/>
    <path class="mouth" d="M27 44 q5 3 10 0"/>`;

  function makeVolt(el, interactive) {
    el.setAttribute("viewBox", "0 0 64 64");
    el.classList.add("volt");
    el.innerHTML = VOLT_SVG;

    const eyes = el.querySelectorAll(".eye");
    const blink = () => {
      el.classList.add("blinking");
      setTimeout(() => el.classList.remove("blinking"), 130);
      setTimeout(blink, 2600 + Math.random() * 3800);
    };
    setTimeout(blink, 1400 + Math.random() * 2200);

    if (interactive) {
      window.addEventListener("mousemove", (e) => {
        const r = el.getBoundingClientRect();
        if (!r.width) return;
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1;
        const m = Math.min(d / 110, 1) * 2.6;
        eyes.forEach((eye) => {
          eye.style.transform = `translate(${(dx / d) * m}px, ${(dy / d) * m}px)`;
        });
      });
      el.addEventListener("click", () => {
        el.classList.add("blinking");
        setTimeout(() => el.classList.remove("blinking"), 150);
      });
    }
    return el;
  }

  function voltMood(mood) {
    if (!heroVolt) return;
    heroVolt.classList.remove("thinking", "alert");
    const mouth = heroVolt.querySelector(".mouth");
    if (mood === "thinking") {
      heroVolt.classList.add("thinking");
      mouth.setAttribute("d", "M29 44 h6");
    } else if (mood === "alert") {
      heroVolt.classList.add("alert");
      mouth.setAttribute("d", "M27 45 q5 -3 10 0");
    } else {
      mouth.setAttribute("d", "M27 44 q5 3 10 0");
    }
  }

  /* -------------------- API -------------------- */
  async function api(path, opts) {
    const res = await fetch(base(path), opts);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.status === 204 ? null : res.json();
  }

  async function carregarConversas() {
    try { conversas = await api("/conversations"); }
    catch (_) { conversas = []; }      // backend fora do ar: segue sem historico
    renderHistory();
  }

  async function abrirConversa(id) {
    activeId = id;
    try { mensagens = await api(`/conversations/${id}/messages`); }
    catch (_) { mensagens = []; }
    render();
  }

  function novaConversa() {
    activeId = null; mensagens = [];
    render(); input.focus();
  }

  /* -------------------- histórico -------------------- */
  function bucket(iso) {
    const dias = (Date.now() - new Date(iso + "Z").getTime()) / 86400000;
    if (dias < 1) return "Hoje";
    if (dias < 7) return "Últimos 7 dias";
    return "Anteriores";
  }

  function renderHistory() {
    const q = search.value.trim().toLowerCase();
    const list = conversas.filter((c) => !q || (c.title || "").toLowerCase().includes(q));
    historyEl.replaceChildren();

    if (!list.length) {
      const d = document.createElement("div");
      d.className = "hist-empty";
      d.textContent = conversas.length ? "Nada encontrado." : "Nenhuma conversa ainda.";
      historyEl.appendChild(d);
      return;
    }

    let grupo = null;
    list.forEach((c) => {
      const b = bucket(c.created_at);
      if (b !== grupo) {
        grupo = b;
        const h = document.createElement("div");
        h.className = "hist-group"; h.textContent = b;
        historyEl.appendChild(h);
      }

      const item = document.createElement("div");
      item.className = "hist-item" + (c.id === activeId ? " is-active" : "");

      const bar = document.createElement("span"); bar.className = "bar";
      const txt = document.createElement("span"); txt.className = "txt"; txt.textContent = c.title;

      const del = document.createElement("button");
      del.className = "del"; del.title = "Excluir conversa";
      del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
      del.addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await api(`/conversations/${c.id}`, { method: "DELETE" }); } catch (_) {}
        if (activeId === c.id) { activeId = null; mensagens = []; }
        await carregarConversas();
        render();
      });

      item.append(bar, txt, del);
      item.addEventListener("click", () => abrirConversa(c.id));
      historyEl.appendChild(item);
    });
  }

  /* -------------------- mensagens -------------------- */
  function botNode({ text, route, sources, err, loading }) {
    const wrap = document.createElement("div");
    wrap.className = "msg bot" + (err ? " err" : "");

    const av = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    av.setAttribute("class", "avatar");
    makeVolt(av, false);

    const body = document.createElement("div"); body.className = "body";
    const head = document.createElement("div"); head.className = "msg-head";
    const who = document.createElement("span"); who.className = "who"; who.textContent = "Volt";
    head.appendChild(who);

    if (route) {
      const b = document.createElement("span");
      b.className = "badge " + route;
      b.textContent = String(route).replace(/_/g, " ");
      head.appendChild(b);
    }
    body.appendChild(head);

    if (loading) {
      const d = document.createElement("div");
      d.className = "dots"; d.innerHTML = "<i></i><i></i><i></i>";
      body.appendChild(d);
    } else {
      const t = document.createElement("div");
      t.className = "text"; t.textContent = text;
      body.appendChild(t);

      if (sources && sources.length) {
        const box = document.createElement("div"); box.className = "sources";
        sources.slice(0, 6).forEach((s) => {
          const tag = document.createElement("span");
          tag.className = "source";
          tag.textContent = typeof s === "string" ? s : (s.source || "fonte");
          box.appendChild(tag);
        });
        body.appendChild(box);
      }
    }

    wrap.append(av, body);
    return wrap;
  }

  function userNode(text) {
    const w = document.createElement("div"); w.className = "msg user";
    const b = document.createElement("div"); b.className = "body"; b.textContent = text;
    w.appendChild(b);
    return w;
  }

  const CHIPS = [
    ["Técnico", "Qual é o registro Modbus para ligar/desligar o carregamento e quais são os valores?"],
    ["Configuração", "O que é Dynamic Load Management e como ativar no GW11K-HCA-20?"],
    ["Diagnóstico", "O carregador está com LED vermelho fixo. Qual é a primeira coisa a verificar?"],
    ["Memória", "Estou no condomínio Solar Park e existem 12 vagas de carregamento."],
  ];

  function renderHero() {
    const hero = document.createElement("div"); hero.className = "hero";
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    heroVolt = makeVolt(svg, true);
    hero.appendChild(svg);

    const h = document.createElement("h2");
    h.innerHTML = 'Oi, eu sou o <b>Volt</b>';
    const p = document.createElement("p");
    p.textContent = "Assistente técnico dos carregadores GoodWe HCA-G2. " +
                    "Registros Modbus, instalação, RFID, diagnóstico de falhas e especificações.";
    hero.append(h, p);

    const chips = document.createElement("div"); chips.className = "chips";
    CHIPS.forEach(([tag, q]) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.innerHTML = "<span>" + tag + "</span>";
      b.appendChild(document.createTextNode(q));
      b.addEventListener("click", () => ask(q));
      chips.appendChild(b);
    });
    hero.appendChild(chips);
    col.appendChild(hero);
  }

  function atualizarMem(n) {
    memtxt.textContent = "memória " + n + (n === 1 ? " turno" : " turnos");
  }

  function render() {
    col.replaceChildren();
    heroVolt = null;

    if (!activeId || !mensagens.length) {
      renderHero();
      atualizarMem(0);
    } else {
      mensagens.forEach((m) => {
        col.appendChild(m.role === "user"
          ? userNode(m.content)
          : botNode({ text: m.content, sources: m.sources || [] }));
      });
      atualizarMem(mensagens.filter((m) => m.role === "user").length);
      scroll.scrollTop = scroll.scrollHeight;
    }
    renderHistory();
  }

  /* -------------------- envio -------------------- */
  async function ask(text) {
    text = (text || "").trim();
    if (busy || !text) return;
    busy = true; send.disabled = true;

    if (col.querySelector(".hero")) col.replaceChildren();
    col.appendChild(userNode(text));

    const pending = botNode({ loading: true });
    col.appendChild(pending);
    scroll.scrollTop = scroll.scrollHeight;

    input.value = ""; input.style.height = "auto";
    voltMood("thinking");

    const t0 = performance.now();
    let resposta;

    try {
      const res = await fetch(base("/agent/chat"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: activeId, message: text }),
      });
      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch (_) {}

      if (!res.ok) {
        resposta = { err: true,
          content: "Erro " + res.status + ".\n\n" +
                   ((data && (data.detail || data.message)) || raw.slice(0, 300)) };
      } else {
        activeId = data.conversation_id || activeId;
        resposta = { content: data.response || "(resposta vazia)",
                     route: data.route || data.blocked_reason || null,
                     sources: data.sources || [] };
      }
    } catch (e) {
      resposta = { err: true,
        content: "Não consegui falar com a API.\n\nSuba o backend:\n" +
                 "  uvicorn app.main:app --reload\n\nDetalhe: " + e.message };
    }

    const ms = Math.round(performance.now() - t0);
    pending.replaceWith(botNode({
      text: resposta.content, route: resposta.route,
      sources: resposta.sources, err: resposta.err,
    }));

    if (!resposta.err) {
      mensagens.push({ role: "user", content: text });
      mensagens.push({ role: "assistant", content: resposta.content, sources: resposta.sources });
      atualizarMem(mensagens.filter((m) => m.role === "user").length);
      await carregarConversas();
    }

    foot.textContent = resposta.err
      ? "Falha na chamada · " + ms + " ms"
      : "Resposta em " + ms + " ms" + (activeId ? " · conversa " + activeId.slice(0, 8) : "");

    voltMood(resposta.err || resposta.route === "bloqueado" ? "alert" : "idle");
    scroll.scrollTop = scroll.scrollHeight;

    busy = false; send.disabled = false; input.focus();
  }

  /* -------------------- eventos -------------------- */
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 190) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  send.addEventListener("click", () => ask(input.value));
  $("new-chat").addEventListener("click", novaConversa);
  search.addEventListener("input", renderHistory);
  $("toggle").addEventListener("click", () => {
    app.classList.toggle(window.innerWidth <= 840 ? "open" : "collapsed");
  });

  makeVolt($("volt-mini"), false);
  render();
  carregarConversas();
  input.focus();
})();
</script>
</body>
</html>
